name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  push:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r scripts/docs/requirements.txt
      - name: Test documentation code extraction
        run: python -m unittest scripts/docs/test_examples.py
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Check generated links and anchors
        run: python scripts/docs/check_links.py
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
