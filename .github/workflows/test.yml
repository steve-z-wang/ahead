name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.3
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Framework gate
        run: ./tool/gate.sh
      - name: Example
        run: ./examples/round-trip/run.sh
