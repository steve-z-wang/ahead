[workspace]
members = ["crates/lfs-core", "crates/lfs-server", "crates/lfs-client", "crates/lfs-sqlite", "bindings/common", "bindings/dart", "crates/lfs-compiler", "integration/rust"]
exclude = ["bindings/node"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
serde_jcs = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
