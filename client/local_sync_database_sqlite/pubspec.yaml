name: local_sync_database_sqlite
description: sqlite_async implementation of the LocalSync database contract.
publish_to: none

environment:
  sdk: ^3.10.3

dependencies:
  local_sync_database:
    path: ../local_sync_database
  sqlite3: ^3.5.0
  # Earlier pools classify read leases as writers and race native update hooks.
  sqlite3_connection_pool: ^0.2.10
  sqlite_async: ^0.14.4

dev_dependencies:
  test: ^1.25.0
